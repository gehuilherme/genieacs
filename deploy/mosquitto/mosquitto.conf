# ============================================================================
# Mosquitto config for the GenieACS DEV stack.
#
# Authentication is enabled with a single shared credential pair (admin/admin123)
# stored hashed in ./passwd. Both the GenieACS USP MQTT bridge AND any CPE
# Agent must present these credentials to publish/subscribe on the broker.
#
# To rotate the password:
#   docker run --rm -v ${PWD}/deploy/mosquitto:/out --entrypoint sh \
#     eclipse-mosquitto:2 -c 'mosquitto_passwd -c -b /out/passwd <user> <pwd>'
#
# For TLS, see docs/usp/mtp/mqtt.rst.
# ============================================================================

listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwd

# Ephemeral broker -- no on-disk state between restarts.
persistence false

# Log to container stdout so `docker compose logs mosquitto` works.
log_dest stdout
