# ============================================================================
# NATS server config for the GenieACS DEV stack.
#
# !!!  DEV ONLY -- no authentication, no TLS. Production deployments must
# !!!  configure operators / accounts / users (or at minimum a token) and TLS.
# ============================================================================

# Client listener.
host: "0.0.0.0"
port: 4222

# HTTP monitoring endpoint (varz, connz, jsz, etc.).
http_port: 8222

# Enable JetStream so the USP services can use streams / KV / object store.
jetstream {
  store_dir: "/data"
}
